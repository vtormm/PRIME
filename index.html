  <title>PRIME</title>
  <style>
    :root{--a:#ffc400;--bg:#050505;--c1:#151515;--c2:#202020;--l:#303030;--m:#999;--good:#35df83;--bad:#ff6674}
    *{box-sizing:border-box}
    button{font-family:inherit;cursor:pointer}
    button,.chip,.habit,.task,.goal,.manage-row,.medal,.level{-webkit-tap-highlight-color:transparent}
    button:not(.template-arrow):not(.icon-round),.chip,.habit .check,.task .taskcheck,.check-circle,.circle-icon-btn{transition:transform .12s ease,background-color .2s ease,opacity .2s ease}
    button:not(.template-arrow):not(.icon-round):active,.chip:active,.check-circle:active,.circle-icon-btn:active{transform:scale(.94)}
    .habit,.task,.goal,.manage-row,.medal{transition:transform .15s ease,opacity .3s ease}
    .habit:active,.task:active,.manage-row:active{transform:scale(.985)}
    .card,.stat,.medal{transition:transform .2s ease,box-shadow .2s ease}
    body{margin:0;background:radial-gradient(ellipse 85% 38% at 50% -5%,color-mix(in srgb,var(--a) 24%,transparent),transparent 73%),var(--bg);color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
    .app{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 17px calc(100px + env(safe-area-inset-bottom))}
    .top,.title,.line{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{font-weight:900;font-size:31px;letter-spacing:3px}
    .date,.muted,.meta{color:var(--m);font-size:11px}
    .hero{text-align:center;padding:20px 0 14px}
    .ring{width:180px;height:180px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--a) 0deg,#292929 0deg);position:relative;box-shadow:0 0 42px color-mix(in srgb,var(--a) 26%,transparent)}
    .ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#070707}
    .ring>*{position:relative;z-index:1}
    .percent{font-size:46px;font-weight:900;line-height:1}
    .percent::after{content:"%";font-size:.55em;vertical-align:super;margin-left:2px}
    .sub{font-size:10px;letter-spacing:3px;color:var(--m)}
    h1{font-size:22px;margin:16px 0 6px}
    .quote{margin:0;color:#aaa;font-style:italic}
    .screen{display:none}.screen.active{display:block}
    .title{margin:22px 0 10px}.title h2{font-size:16px;letter-spacing:2px;margin:0}
    .title-actions{display:flex;gap:8px}
    .btn,.add,.logout,.secondary,.edit{background:var(--c2);border:1px solid var(--l);border-radius:14px;color:#fff;padding:8px 11px;font-size:12px}
    .card{background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid var(--l);border-radius:22px;padding:16px;margin:10px 0}
    .habit,.task,.line{padding:13px 0;border-bottom:1px solid #282828}.habit:last-child,.task:last-child,.line:last-child{border:0}
    .habit,.task{display:flex;align-items:center;gap:11px}
    .check,.taskcheck{flex:none;width:34px;height:34px;border-radius:50%;background:none;border:2px solid #555;color:#111;transition:background-color .2s ease,border-color .2s ease,transform .12s ease}
    .done .check{background:#fff;border-color:#fff}.done .name{text-decoration:line-through;color:#777}
    .task .taskcheck{width:25px;height:25px;border-radius:8px}.task.done .taskcheck{background:var(--good);border-color:var(--good)}
    .name{flex:1;min-width:0;overflow-wrap:anywhere}.emoji{font-size:23px}
    .empty{text-align:center;color:#777;padding:26px 5px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#111;border:1px solid var(--l);border-radius:16px;padding:13px 3px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:var(--m)}
    .pyramid-card{overflow:hidden;position:relative}

<body>
<div id="root"></div>

<!-- Modal rápido añadir/editar -->
<div id="modal" class="modal" aria-hidden="true">
  <div class="sheet">
    <h2 id="modalTitle">Añadir</h2>
    <select id="itemType" class="field">
      <option value="habit">Hábito diario</option>
      <option value="task">Tarea</option>
      <option value="goal">Meta</option>
    </select>
    <input id="itemName" class="field" placeholder="Nombre">
    <input id="itemEmoji" class="field" placeholder="Emoji opcional" maxlength="2">
    <input id="itemDate" class="field" type="date">
    <input id="itemImage" class="field" type="file" accept="image/*">
    <button id="saveItem" class="btn" style="width:100%;background:var(--a);border:0;color:#111;font-weight:800">Guardar</button>
    <button id="cancelModal" class="secondary" style="width:100%;margin-top:8px">Cancelar</button>
  </div>
</div>

<!-- Modal edición avanzada -->
<div id="editModal" class="modal" aria-hidden="true">
  <div class="sheet">
    <h2 id="editTitle">Editar</h2>
    <div class="edit-modal">
      <label class="small">EMOJI</label>
      <div class="emoji-edit-row">
        <div id="editEmojiPreview" class="emoji-preview">⚪</div>
        <input id="editEmojiInput" class="field" maxlength="4" placeholder="Escribe o pega un emoji" style="flex:1">
      </div>
      <label class="small">NOMBRE *</label>
      <input id="editName" class="field" placeholder="Nombre">
      <label class="small">DESCRIPCIÓN</label>
      <textarea id="editDesc" class="field" placeholder="Opcional" style="min-height:60px"></textarea>
      <div id="editDateWrap">
        <label class="small">FECHA</label>
        <input id="editDate" class="field" type="date">
      </div>
      <div id="editDaysWrap">
        <label class="small">DÍAS DE LA SEMANA *</label>
        <div class="weekday-quick">
          <button type="button" class="chip" data-quick="all">TODOS</button>
          <button type="button" class="chip" data-quick="weekdays">LUN-VIE</button>
          <button type="button" class="chip" data-quick="weekend">FIN DE SEMANA</button>
        </div>
        <div id="weekdayChips" class="weekday-row"></div>
      </div>
      <div class="edit-actions">
        <button id="editCancel" class="secondary" style="flex:1">Cancelar</button>
        <button id="editSave" class="btn" style="flex:1;background:var(--a);border:0;color:#111;font-weight:800">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirmación propia de la app (en vez de confirm() nativo, que no funciona
     como app instalada en pantalla de inicio) -->
<div id="confirmOverlay" class="modal" aria-hidden="true">
  <div class="sheet" style="text-align:center">
    <p id="confirmMsg" style="font-size:15px;margin:4px 0 20px;line-height:1.4"></p>
    <div class="edit-actions">
      <button id="confirmCancel" class="secondary" style="flex:1">Cancelar</button>
      <button id="confirmOk" class="btn" style="flex:1;background:var(--bad);border:0;color:#111;font-weight:800">Eliminar</button>
    </div>
  </div>
</div>

<!-- Resumen diario: aparece la primera vez que se abre la app cada día -->
<div id="summaryOverlay" class="modal" aria-hidden="true">
  <div class="sheet" style="text-align:center">
    <div style="font-size:34px;margin-bottom:4px">☀️</div>
    <h2 style="margin:0 0 14px">Resumen de ayer</h2>
    <div id="summaryBody"></div>
    <button id="summaryClose" class="btn" style="width:100%;background:var(--a);border:0;color:#111;font-weight:800;margin-top:18px">Continuar</button>
  </div>
</div>

<!-- Menú flotante de opciones de edición -->
<div id="editMenuOverlay" class="edit-menu-overlay">
  <div id="editMenu" class="edit-menu">
    <h4 id="editMenuTitle">Hábitos</h4>
    <button data-action="edit"><span class="mi">✏️</span><span class="ml">Editar hábitos</span></button>
    <button data-action="delete" class="danger-action"><span class="mi">🗑</span><span class="ml">Eliminar hábitos</span></button>
    <button data-action="reorder"><span class="mi">↕️</span><span class="ml">Ordenar hábitos</span></button>
    <button class="cancel-mini" data-action="cancel">Cerrar</button>
  </div>
</div>

<!-- Pantalla de gestión a pantalla completa: Editar / Eliminar / Ordenar -->
<div id="manageOverlay" class="manage-overlay" aria-hidden="true">
  <header class="manage-head">
    <button id="manageBack" class="icon-round">←</button>
    <h2 id="manageTitle">Editar</h2>
    <button id="manageDone" class="btn">Listo</button>
  </header>
  <div id="manageBody" class="manage-body"></div>
  <div id="manageFooter" class="manage-footer"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
/* === Actualización 6 (sobre la anterior) === dos bugs reales más:
   1) La racha global (Progreso) seguía contando aunque no llegaras al 50%:
      globalCurrentStreak/globalBestStreak ponían la hora a las 00:00 locales
      antes de convertir a fecha ISO (UTC). En zonas horarias por delante de UTC
      (como España) eso desplaza la fecha comparada un día entero, así que se
      comparaba con el día equivocado y el filtro del 50% no aplicaba bien.
      Ahora se mantiene la misma hora que "ahora mismo" (igual que hace `today`
      en el resto de la app) y solo se cambia el día del calendario, sin salto.
   2) Diario "Leer / Editar" cargaba la entrada antigua en el formulario, pero
      "Guardar entrada" guardaba SIEMPRE en el día de hoy (no en la fecha que
      estabas editando), así que la edición nunca se reflejaba en la entrada
      original. Ahora hay una fecha "activa" (editingDiaryDate): al abrir una
      entrada del historial se edita esa fecha en concreto (con aviso "Editando:
      2026-08-10 · volver a hoy" arriba del formulario), y Guardar entrada
      escribe en esa fecha. Al guardar, vuelve automáticamente a hoy.

   === Actualización 5 (sobre la anterior) === bugs reales encontrados y corregidos:
   1) Metas que no se guardaban: la causa más probable es que el documento de
      Firestore (todos tus datos viven en un único documento por usuario) superó
      el límite de 1MB por acumular fotos de metas en base64 sin comprimir.
      - Las fotos nuevas ahora se redimensionan/comprimen (canvas -> JPEG) antes
        de guardarse, así que pesan muchísimo menos.
      - Además, al abrir la app se comprimen en segundo plano las fotos ya
        guardadas que pesaran demasiado, y se vuelve a guardar automáticamente.
      - save() ahora avisa con un toast si un guardado falla por cualquier
        motivo, en vez de fallar en silencio como hasta ahora (así, si vuelve a
        pasar algo raro, se verá el motivo en pantalla).
   2) "Leer / Editar" del diario no hacía nada: el código que conectaba esos
      botones se ejecutaba ANTES de que existieran (se generan dentro de
      renderDiary(), que se llamaba después). Ahora se conectan dentro de la
      propia renderDiary(), justo después de crearlos.
   3) Emoji de las tareas invisible: taskRow() nunca pintaba el emoji (a
      diferencia de habitRow(), que sí lo hacía). Añadido.
   4) Resumen diario nuevo: al abrir la app por primera vez cada día se muestra
      un modal con cuántos hábitos completaste ayer (X/Y, %) y tu racha actual.
      Se guarda la fecha en data.settings.lastSummaryDate para que no se repita
      el mismo día.
   5) Bug de sesión que obligaba a reiniciar la app: login() borraba
      document.body.innerHTML entero (incluyendo #root y TODOS los overlays:
      modal, editModal, manageOverlay, editMenuOverlay, confirmOverlay). Al
      iniciar sesión, render() intentaba escribir en #root, que ya no existía,
      y la app se quedaba rota hasta recargar. Ahora login() solo sustituye el
      contenido de #root, igual que hace render(), sin tocar el resto del DOM.
   6) Progreso (pirámide/medallas): ahora un día solo cuenta para la racha si
      completaste el 50% o más de los hábitos que tocaban ese día (antes se
      basaba en la racha del hábito individual más constante, aunque solo
      cumplieras uno de varios). Recorre día a día desde tu primer registro.
   7) Tutorial cortado en Ajustes: el panel desplegable tenía un límite fijo de
      altura (700px) insuficiente para el contenido del tutorial. Ahora la
      altura se calcula con el contenido real (scrollHeight) cada vez que se
      abre, así que nunca se corta, sea cual sea su longitud.

let ringDisplayed=0, ringAnimFrame=null; // valor mostrado en el anillo, persiste entre renders

function updateRing(val){
  const ring=$('ring');if(!ring)return;
  const deg=Math.max(0,Math.min(100,val))*3.6;
  ring.style.background=`conic-gradient(var(--a) 0deg ${deg}deg,#292929 ${deg}deg 360deg)`;
}
// anima el anillo desde el valor que ya se estaba mostrando hasta el nuevo objetivo
// (no siempre desde 0), cancelando cualquier animación anterior en curso: así es
// fluida (no da saltos ni se reinicia con cada render) y precisa (siempre acaba
// exactamente en el valor real, sin animaciones solapadas escribiendo a la vez)
function animateRing(target){
  const elPerc=$('percent');if(!elPerc)return;
  if(ringAnimFrame){cancelAnimationFrame(ringAnimFrame);ringAnimFrame=null;}
  const startVal=ringDisplayed;
  const diff=target-startVal;
  if(diff===0){updateRing(target);elPerc.textContent=target;return;}
  const duration=Math.min(1200,350+Math.abs(diff)*9);
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-t,3); // ease-out cúbico
    const val=startVal+diff*eased;
    updateRing(val);
    $('percent').textContent=Math.round(val);
    if(t<1){ringAnimFrame=requestAnimationFrame(step);}
    else{updateRing(target);$('percent').textContent=target;ringDisplayed=target;ringAnimFrame=null;}
  }
  ringAnimFrame=requestAnimationFrame(step);
}

// redimensiona y comprime una imagen antes de guardarla (evita que las fotos de
// las metas hagan crecer el documento de Firestore por encima de su límite de 1MB,
// que era la causa más probable de que las metas dejaran de guardarse)
function compressImage(dataUrl,maxDim=700,quality=0.72){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function appearsOn(h,d){
  if(!h.days||h.days==='all')return true;
  const wd=d.getDay();
  if(h.days==='weekdays')return wd>=1&&wd<=5;
  if(h.days==='weekend')return wd===0||wd===6;
  if(Array.isArray(h.days))return h.days.includes(wd);
  return true;
}
function appearsToday(h){return appearsOn(h,new Date());}
function current(h){return h.done?.includes(today);} 
function streak(h){let n=0,d=new Date();while(h.done?.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1);}return n;}
function best(h){const a=[...(h.done||[])].sort();let r=0,p=null,mm=0;for(const x of a){const d=new Date(x);if(p&&(d-p)/86400000===1)r++;else r=1;p=d;mm=Math.max(mm,r);}return mm;}

// "Día conseguido" para el Progreso (pirámide/medallas): cuenta si ese día se
// completó el 50% o más de los hábitos que tocaban ese día (no cualquier hábito
// suelto). Se recorre día a día desde el primer registro hasta hoy.
function dayRatio(d){
  const ds=d.toISOString().slice(0,10);
  const hs=(data.habits||[]).filter(h=>appearsOn(h,d));
  if(!hs.length)return 0;
  return hs.filter(h=>h.done?.includes(ds)).length/hs.length;
}
function isSuccessDay(d){return dayRatio(d)>=0.5;}
function globalCurrentStreak(){
  let n=0;const d=new Date();
  while(isSuccessDay(d)){n++;d.setDate(d.getDate()-1);}
  return n;
}
function globalBestStreak(){
  const hs=data.habits||[];if(!hs.length)return 0;
  let minDateStr=null;
  hs.forEach(h=>(h.done||[]).forEach(ds=>{if(!minDateStr||ds<minDateStr)minDateStr=ds;}));
  if(!minDateStr)return 0;
  const[y,m,dd]=minDateStr.split('-').map(Number);
  const d=new Date();d.setFullYear(y,m-1,dd); // mismo reloj que "ahora", solo cambia el día
  const todayD=new Date();
  let bestRun=0,run=0;
  while(d<=todayD){
    if(isSuccessDay(d)){run++;bestRun=Math.max(bestRun,run);}else run=0;
    d.setDate(d.getDate()+1);
  }
  return bestRun;
}

  if(!sel||sel==='all')activeSet=new Set(wdMap);
  else if(sel==='weekdays')activeSet=new Set([1,2,3,4,5]);

  cont.innerHTML=weekdayLabels.map((l,i)=>`<button type="button" class="chip ${activeSet.has(wdMap[i])?'active':''}" data-wd="${wdMap[i]}">${l}</button>`).join('');

}

// confirmación propia de la app: confirm() nativo no funciona de forma fiable
// cuando la app está instalada en la pantalla de inicio (modo standalone)
function customConfirm(msg){
  return new Promise(resolve=>{
    $('confirmMsg').textContent=msg;
    $('confirmOverlay').classList.add('open');$('confirmOverlay').setAttribute('aria-hidden','false');
    function done(result){
      $('confirmOverlay').classList.remove('open');$('confirmOverlay').setAttribute('aria-hidden','true');
      $('confirmOk').onclick=null;$('confirmCancel').onclick=null;
      resolve(result);
    }
    $('confirmOk').onclick=()=>done(true);
    $('confirmCancel').onclick=()=>done(false);
  });
}

// antes de comprimir en origen, la reduce ahora (probable causa de que el documento
// superase el límite de 1MB de Firestore y dejaran de guardarse cambios)
let migratingImages=false;
async function compressExistingGoalImages(){
  if(migratingImages)return;
  const goals=data.goals||[];
  const heavy=goals.filter(g=>g.image && g.image.length>180000);
  if(!heavy.length)return;
  migratingImages=true;
  for(const g of heavy){g.image=await compressImage(g.image);}
  try{await save();}catch(e){/* el toast de error ya lo muestra save() */}
  migratingImages=false;
}
function closeManageScreen(){
  $('manageOverlay').classList.remove('open');$('manageOverlay').setAttribute('aria-hidden','true');

function renderManageScreen(){
  if(!manageState)return;
  const {type,action}=manageState;
  const arr=data[type]||[];
  const label=type==='habits'?'hábitos':type==='tasks'?'tareas':'metas';
  const singular=type==='habits'?'hábito':type==='tasks'?'tarea':'meta';
  const titleMap={edit:'Editar '+label,delete:'Eliminar '+label,reorder:'Ordenar '+label};
  $('manageTitle').textContent=titleMap[action]||'Editar';
  const emojiOf=it=>esc(it.emoji||(type==='goals'?'◎':'⚪'));

  if(action==='edit'){
    $('manageBody').innerHTML=`<div class="manage-card">${arr.length?arr.map(it=>`<div class="manage-row"><button class="circle-icon-btn" data-edit="${it.id}">✏️</button><div class="remoji">${emojiOf(it)}</div><div class="rname">${esc(it.name)}</div></div>`).join(''):`<div class="empty">Todavía no hay ${label}.</div>`}</div>`;
    $('manageFooter').innerHTML='';
    $('manageBody').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(type,b.dataset.edit));

  }else if(action==='delete'){
    $('manageBody').innerHTML=`<div class="manage-card">${arr.length?arr.map(it=>`<div class="manage-row"><button class="check-circle ${manageState.selection.has(it.id)?'checked':''}" data-check="${it.id}">${manageState.selection.has(it.id)?'✓':''}</button><div class="remoji">${emojiOf(it)}</div><div class="rname">${esc(it.name)}</div></div>`).join(''):`<div class="empty">Todavía no hay ${label}.</div>`}</div>`;
    const n=manageState.selection.size;
    $('manageFooter').innerHTML=n?`<button id="manageDeleteBtn" class="danger-btn">🗑 Eliminar ${n} ${n===1?singular:label}</button>`:'';
    $('manageBody').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.check;
      if(manageState.selection.has(id))manageState.selection.delete(id);else manageState.selection.add(id);
      renderManageScreen();
    });
    const delBtn=$('manageDeleteBtn');
    if(delBtn)delBtn.onclick=async()=>{
      if(!(await customConfirm(`¿Eliminar ${manageState.selection.size} elemento(s)?`)))return;
      data[type]=arr.filter(x=>!manageState.selection.has(x.id));
      await save();manageState.selection=new Set();render();renderManageScreen();toast('Elementos eliminados');
    };

  }else if(action==='reorder'){
    $('manageBody').innerHTML=`<div class="manage-card">${arr.length?arr.map((it,i)=>`<div class="manage-row"><span class="drag-handle">⠿</span><div class="remoji">${emojiOf(it)}</div><div class="rname">${esc(it.name)}</div><div style="display:flex;gap:6px"><button class="template-arrow" data-move="${i}" data-d="-1"><span>↑</span></button><button class="template-arrow" data-move="${i}" data-d="1"><span>↓</span></button></div></div>`).join(''):`<div class="empty">Todavía no hay ${label}.</div>`}</div>`;
    $('manageFooter').innerHTML='';
    $('manageBody').querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{
      const i=Number(b.dataset.move),d=Number(b.dataset.d),j=i+d;
      if(j<0||j>=arr.length)return;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      await save();render();renderManageScreen();
    });
  }
}

// Rangos de la pirámide: cada nivel tiene su propio color, nombre y ancho (en % del hueco disponible)
const PYRAMID_TIERS=[
  {x:1,  name:'Iniciado',  c1:'#8a5a34', c2:'#e0a868', w:94},
  {x:3,  name:'Constante', c1:'#7d818c', c2:'#eef1f7', w:80},
  {x:7,  name:'Firme',     c1:'#a67c00', c2:'#ffe27a', w:66},
  {x:15, name:'Imparable', c1:'#0d8f5c', c2:'#6dffc2', w:52},
  {x:30, name:'Élite',     c1:'#5b2ea6', c2:'#c9a6ff', w:38},
  {x:60, name:'Leyenda',   c1:'#ff5fa2', c2:'#ffd24a', w:26, legendary:true}
];
function renderProgress(){
  const mx = globalBestStreak();
  const currentTier=[...PYRAMID_TIERS].reverse().find(t=>mx>=t.x); // rango más alto ya conseguido
  $('levels').innerHTML = PYRAMID_TIERS.map(t=>{
    const unlocked=mx>=t.x, isCurrent=!!currentTier && t.x===currentTier.x;
    return `<div class="level ${unlocked?'':'lock'} ${isCurrent?'current':''} ${t.legendary?'legendary':''}" id="lvl-${t.x}" style="--w:${t.w}%;--c1:${t.c1};--c2:${t.c2}">
      <span class="lvl-tier">${t.name}</span>
      <span class="lvl-days">${t.x}D</span>
      <span class="lvl-icon">${unlocked?(isCurrent?'👑':'✓'):'🔒'}</span>
    </div>`;
  }).join('');
  $('levels').closest('.pyramid-card').style.setProperty('--pyr-glow', (currentTier||PYRAMID_TIERS[0]).c2);
  const nextTier=PYRAMID_TIERS.find(t=>mx<t.x);
  $('pyramidCaption').innerHTML = nextTier
    ? `Racha máxima: <b>${mx} días</b> · te faltan <b>${nextTier.x-mx}</b> para <b style="color:${nextTier.c2}">${esc(nextTier.name)}</b> (${nextTier.x}D)`
    : `🏔️ ¡Pirámide completa! Eres <b style="color:#ffd24a">Leyenda</b> con ${mx} días de racha máxima`;

  // medallas por racha (mejor racha entre todos los hábitos)
  const medalIcons=['🌱','🔥','⚡','🏆','👑','🚀'];
  $('medals').innerHTML = PYRAMID_TIERS.map((t,i)=>{
    const x = i===3?14:t.x; // medallas usan 14 días en vez de 15 para ese escalón
    const unlocked=mx>=x;
    return `<div class="medal ${unlocked?'unlocked':'lock'} ${unlocked&&t.legendary?'legendary':''}" style="--c1:${t.c1};--c2:${t.c2}"><div class="medal-icon">${medalIcons[i]}</div><b>${x} días</b><div class="small">${unlocked?'Conseguida':'Bloqueada'}</div></div>`;
  }).join('');
}

function renderDiary(){
  if(!editingDiaryDate)editingDiaryDate=today;
  const keys=Object.keys(data.diary||{}).sort().reverse();
  const isPast=editingDiaryDate!==today;
  $('diaryDate').innerHTML = isPast
    ? `Editando: <b>${editingDiaryDate}</b> · <a href="#" id="diaryBackToday" style="color:var(--a)">volver a hoy</a>`
    : new Intl.DateTimeFormat('es-ES',{dateStyle:'full'}).format(new Date());
  const e=data.diary?.[editingDiaryDate]||{};
  $('diaryFeeling').value=e.feeling||'';
  $('diaryMemory').value=e.memory||'';
  $('diaryText').value=e.text||'';
  $('diaryHistory').innerHTML=keys.length?keys.slice(0,7).map(d=>{
    const e=data.diary[d];
    return `<div class="line"><div class="name"><b>${d}</b><div class="small">Felicidad: ${e.feeling||'-'}/10 · ${esc(e.memory||'')}</div><div class="small">${esc((e.text||'').slice(0,120))}${(e.text||'').length>120?'…':''}</div></div><button class="btn" data-diary-open="${d}" style="padding:6px 10px;font-size:11px">Leer / Editar</button></div>`;}).join(''):'<div class="empty">Todavía no hay entradas.</div>';
  document.querySelectorAll('[data-diary-open]').forEach(b=>b.onclick=()=>loadDiary(b.dataset.diaryOpen));
  if($('diaryBackToday'))$('diaryBackToday').onclick=(ev)=>{ev.preventDefault();editingDiaryDate=today;renderDiary();};
}

function loadDiary(dateKey){
  editingDiaryDate=dateKey;currentScreen='diary';navigate('diary');renderDiary();
}

function tutorialHtml(){return `
  <div class="tutorial-card"><div class="tutorial-head"><div class="bubble">✓</div><div><div>Hábitos</div><div class="small">Guía rápida y al grano.</div></div></div><ol><li>Toca el + para crear un hábito con nombre, emoji y días de la semana.</li><li>Marca cada hábito al completarlo en el día.</li><li>Completa todos los hábitos del día para mantener tu racha (streak).</li><li>La racha se confirma a la medianoche: si todo está marcado, el día cuenta.</li></ol></div>
  <div class="tutorial-card"><div class="tutorial-head"><div class="bubble">☑</div><div><div>Tareas</div><div class="small">Compromisos puntuales.</div></div></div><ol><li>Crea tareas con nombre, fecha y horario opcional.</li><li>Toca para marcar como completada. Las tareas no afectan a la racha.</li><li>Úsalas para compromisos, plazos y recordatorios puntuales.</li></ol></div>
  <div class="tutorial-card"><div class="tutorial-head"><div class="bubble">◎</div><div><div>Metas</div><div class="small">Objetivos y progreso.</div></div></div><ol><li>Crea metas con título, plazo y tipo (personal o financiera).</li><li>Actualiza el progreso manualmente conforme avanzas.</li><li>Agrega una imagen para visualizar tu objetivo.</li><li>Las metas pueden vincularse a un hábito para progreso automático.</li></ol></div>
  <div class="tutorial-card"><div class="tutorial-head"><div class="bubble">▤</div><div><div>Diario</div><div class="small">Reflexiona cada día.</div></div></div><ol><li>Escribe cómo ha ido tu día y una cosa que te haya marcado.</li><li>Valora tu felicidad del 1 al 10 para ver tu tendencia.</li><li>Revisa y edita entradas pasadas desde la lista de historial.</li></ol></div>
  <div class="tutorial-card"><div class="tutorial-head"><div class="bubble">◔</div><div><div>Progreso</div><div class="small">Constancia visualizada.</div></div></div><ol><li>La pirámide sube con tus mejores rachas de hábitos.</li><li>Los niveles 1, 3, 7, 15, 30 y 60 días se iluminan al desbloquearlos.</li><li>Utiliza el progreso para ver en qué etapas eres más constante.</li></ol></div>
`}

function icon(x){return {home:'⌂',tasks:'☑',goals:'◎',progress:'◔',diary:'▤',settings:'⚙'}[x]||'•'}

function makeNav(){
  const order=data.settings?.tabs||['home','tasks','goals','progress','diary','settings'];
  const hidden=data.settings?.hidden||[];
  const visible=order.filter(x=>!hidden.includes(x)||x==='settings');
  $('nav').innerHTML=visible.map(x=>`<button data-nav="${x}" class="${x===currentScreen?'active':''}"><b>${icon(x)}</b>${labels[x]}</button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
}

function navigate(id){
  currentScreen=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));
  $('hero').style.display=id==='home'?'block':'none';
}

async function toggleHabit(id){
  const h=data.habits.find(x=>x.id===id);if(!h)return;
  if(!h.done.includes(today)){h.done.push(today);celebrate();toast('Hábito completado');}
  else{h.done=h.done.filter(x=>x!==today);toast('Marcado como pendiente');}
  await save();render();
}
async function toggleTask(id){
  const t=data.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;if(t.done){celebrate();toast('Tarea completada');}
  await save();render();
}

async function addOrEdit(){
  const name=$('itemName').value.trim();if(!name)return toast('Escribe un nombre');
  const type=$('itemType').value,emoji=$('itemEmoji').value.trim(),date=$('itemDate').value,file=$('itemImage').files[0];
  const finish=async(image='')=>{
    if(editingQuick){
      const arr=editingQuick.type==='habit'?data.habits:editingQuick.type==='goal'?data.goals:data.tasks;
      const it=arr.find(x=>x.id===editingQuick.item.id);if(!it)return;Object.assign(it,{name,emoji,date});if('image'in it&&image)it.image=image;
    }else{
      const item={id:uid(),name,emoji,date};if(type==='habit')item.done=[];if(type==='goal')item.image=image;
      if(type==='habit')data.habits.push(item);else if(type==='task')data.tasks.push({...item,done:false});else data.goals.push(item);
    }
    try{await save();}catch(e){return;} // el toast de error ya lo muestra save(); dejamos el modal abierto para reintentar
    closeQuickModal();render();toast(editingQuick?'Elemento editado':(type==='habit'?'Hábito añadido':type==='task'?'Tarea añadida':'Meta añadida'));
  };
  if(file){
    const r=new FileReader();
    r.onload=async()=>finish(await compressImage(r.result));
    r.readAsDataURL(file);
  }else finish('');
}

async function saveDiaryEntry(){
  const feeling=Math.max(1,Math.min(10,Number($('diaryFeeling').value||0)));
  const memory=$('diaryMemory').value.trim();
  const text=$('diaryText').value.trim();
  if(!text&&!memory)return toast('Escribe algo para guardar');
  const dateKey=editingDiaryDate||today;
  data.diary[dateKey]={feeling:feeling||'',memory,text,updatedAt:Date.now()};
  editingDiaryDate=today;
  await save();$('diaryText').value='';$('diaryMemory').value='';$('diaryFeeling').value='';render();toast('Entrada guardada');
}

function renderTemplates(){
  const order=data.settings.tabs;const hidden=data.settings.hidden||[];
  const iconsMap={home:'⌂',tasks:'☑',goals:'◎',progress:'◔',diary:'▤',settings:'⚙'};
  $('screenOrder').innerHTML=order.map((x,i)=>`<div class="template-line"><div class="template-label"><button class="template-arrow" data-move="${i}" data-d="-1"><span>↑</span></button><button class="template-arrow" data-move="${i}" data-d="1"><span>↓</span></button><span>${iconsMap[x]||'•'}</span><span>${labels[x]}</span></div><label class="small"><input type="checkbox" data-hide="${x}" ${hidden.includes(x)?'':'checked'} ${x==='settings'?'disabled':''}> Mostrar</label></div>`).join('');

  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.move),d=Number(b.dataset.d);const a=data.settings.tabs;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save().then(()=>{render();navigate('settings');});
  });

  document.querySelectorAll('[data-hide]').forEach(b=>b.onchange=()=>{
    const key=b.dataset.hide;if(key==='settings'){b.checked=true;return toast('Ajustes no se puede ocultar.');}
    const h=data.settings.hidden||[];
    if(b.checked)data.settings.hidden=h.filter(x=>x!==key);else data.settings.hidden=[...new Set([...h,key])];
    save().then(()=>{makeNav();renderTemplates();});
  });
}

function render(){
  document.documentElement.style.setProperty('--a',data.profile?.color||'#ffc400');
  const hsAll=data.habits||[];const hs=hsAll.filter(appearsToday);const done=hs.filter(current).length;const p=hsAll.length?Math.round(done/hsAll.length*100):0;

  $('root').innerHTML=`<main class="app">
    <header class="top"><div class="brand">PRIME</div><div class="date">${new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase()}</div><button id="logout" class="logout">Salir</button></header>
    <section id="hero" class="hero"><div class="ring" id="ring"><div><div class="percent" id="percent">${p}</div><div class="sub">HOY</div></div></div><h1 id="headline">${p===100?'DÍA DOMINADO.':p>0?'VAMOS BIEN.':'EMPIEZA HOY.'}</h1><p class="quote">${p===100?'Tu consistencia ya se nota.':'La versión que quieres ser se construye hoy.'}</p></section>

    ${section('home',`<div class="title"><h2>HÁBITOS</h2><div class="title-actions"><button class="add" data-open="habit">+</button><button class="edit" id="editHabits">✏️</button></div></div><div id="habits" class="card">${hs.length?hs.map(habitRow).join(''):'<div class="empty">Añade tu primer hábito.</div>'}</div><div class="stats"><div class="stat"><b>${Math.max(...hsAll.map(streak),0)}</b><span>racha actual</span></div><div class="stat"><b>${Math.max(...hsAll.map(best),0)}</b><span>mejor racha</span></div><div class="stat"><b>${done}</b><span>completados hoy</span></div></div>`)}

    ${section('tasks',`<div class="title"><h2>TAREAS</h2><div class="title-actions"><button class="add" data-open="task">+</button><button class="edit" id="editTasks">✏️</button></div></div><div id="taskList" class="card">${(data.tasks||[]).length?(data.tasks||[]).map(taskRow).join(''):'<div class="empty">Añade tareas para mantener el foco.</div>'}</div>`)}

    ${section('goals',`<div class="title"><h2>METAS</h2><div class="title-actions"><button class="add" data-open="goal">+</button><button class="edit" id="editGoals">✏️</button></div></div><div id="goalList" class="grid">${(data.goals||[]).length?(data.goals||[]).map(goalCard).join(''):'<div class="empty">Crea una meta que te motive.</div>'}</div>`)}

    ${section('progress',`<div class="title"><h2>PROGRESO</h2></div><div class="card pyramid-card"><p class="muted">PIRÁMIDE DE CONSTANCIA</p><div class="pyramid-wrap"><div id="levels" class="levels"></div></div><p id="pyramidCaption" class="muted" style="text-align:center"></p></div><div class="card"><p class="muted">MEDALLAS</p><div id="medals" class="grid"></div></div>`)}

    ${section('diary',`<div class="title"><h2>DIARIO</h2></div><div class="card"><p id="diaryDate" class="muted"></p><input id="diaryFeeling" class="field" type="number" min="1" max="10" placeholder="¿Cómo de feliz he sido hoy? (1-10)"><textarea id="diaryMemory" class="field" style="min-height:90px" placeholder="Una cosa que me haya marcado hoy..."></textarea><textarea id="diaryText" class="field textarea" placeholder="Escribe cómo ha ido tu día..."></textarea><button id="saveDiary" class="btn" style="width:100%;background:var(--a);border:0;color:#111;font-weight:800">Guardar entrada</button></div><div id="diaryHistory" class="card"></div>`)}

    ${section('settings',`<div class="title"><h2>AJUSTES</h2></div><div class="settings-wrap">
      <button class="setting-btn" data-panel="account"><span class="setting-icon">👤</span><span class="setting-text"><b>Cuenta</b><small>Perfil y contraseña</small></span><span class="chev">›</span></button>
      <div id="panel-account" class="setting-panel"><p class="small">${esc(data.profile?.name||'') || user.email}</p><input id="newPass" class="field" type="password" placeholder="Nueva contraseña"><button id="changePass" class="btn" style="width:100%">Cambiar contraseña</button></div>
      <button class="setting-btn" data-panel="screens"><span class="setting-icon">🗂️</span><span class="setting-text"><b>Plantillas</b><small>Orden y visibilidad de pestañas</small></span><span class="chev">›</span></button>
      <div id="panel-screens" class="setting-panel"><div id="screenOrder"></div></div>
      <button class="setting-btn" data-panel="theme"><span class="setting-icon">🎨</span><span class="setting-text"><b>Tema y aura</b><small>Color principal de la app</small></span><span class="chev">›</span></button>
      <div id="panel-theme" class="setting-panel"><div id="colors" class="swatches"></div><input id="custom" type="color" class="field" style="padding:4px 8px;height:40px" value="${data.profile?.color||'#ffc400'}"></div>
      <button class="setting-btn" data-panel="tutorial"><span class="setting-icon">🧭</span><span class="setting-text"><b>Tutorial</b><small>Cómo funciona la app</small></span><span class="chev">›</span></button>
      <div id="panel-tutorial" class="setting-panel">${tutorialHtml()}</div>
      <button class="setting-btn danger" data-panel="faq"><span class="setting-icon">❓</span><span class="setting-text"><b>Preguntas frecuentes</b><small>Dudas comunes</small></span><span class="chev">›</span></button>
      <div id="panel-faq" class="setting-panel"><p class="small">La sección de ajustes no puede ocultarse para evitar que la app se rompa.</p></div>
      <button class="setting-btn" data-panel="contact"><span class="setting-icon">✉️</span><span class="setting-text"><b>Contacto</b><small>Soporte y comunidad</small></span><span class="chev">›</span></button>
      <div id="panel-contact" class="setting-panel"><p class="small">Soporte y comunidad se mantienen aquí.</p></div>
    </div>`)}

    <nav id="nav" class="nav"></nav>
  </main>`;

  animateRing(p);

  $('logout').onclick=()=>signOut(auth);

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQuickModal(b.dataset.open));

  // botón editar abre menú flotante
  $('editHabits').onclick=()=>{if(!(data.habits||[]).length)return toast('No hay hábitos');openEditMenu('habits');};
  $('editTasks').onclick=()=>{if(!(data.tasks||[]).length)return toast('No hay tareas');openEditMenu('tasks');};
  $('editGoals').onclick=()=>{if(!(data.goals||[]).length)return toast('No hay metas');openEditMenu('goals');};

  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>toggleHabit(b.dataset.h));
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.t));

  document.querySelectorAll('.setting-btn').forEach(b=>b.onclick=()=>{const panel=$('panel-'+b.dataset.panel);const isOpen=panel.classList.contains('open');document.querySelectorAll('.setting-panel').forEach(x=>{x.classList.remove('open');x.style.maxHeight='0px';});document.querySelectorAll('.setting-btn').forEach(x=>x.classList.remove('open'));if(!isOpen){panel.classList.add('open');b.classList.add('open');panel.style.maxHeight=panel.scrollHeight+'px';}});

  $('changePass').onclick=async()=>{const pval=$('newPass').value.trim();if(pval.length<6)return toast('Mínimo 6 caracteres');await updatePassword(user,pval);toast('Contraseña cambiada');};

  const sw=['#ffc400','#6ca9ff','#35df83','#d879ff','#ff6674','#f1f1f1','#8cf0ff','#ffa94d','#b197fc','#69db7c','#ff8787','#ffffff'];
  $('colors').innerHTML=sw.map(c=>`<button class="swatch" data-color="${c}" style="background:${c}"></button>`).join('');
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{data.profile.color=b.dataset.color;save().then(render);});
  $('custom').oninput=e=>{data.profile.color=e.target.value;save().then(render);};

  makeNav();
  renderProgress();
  renderDiary();
  renderTemplates();
}

// listeners globales
$('saveItem').onclick=addOrEdit;
$('cancelModal').onclick=closeQuickModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeQuickModal();});
$('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEdit();});
$('editSave').onclick=applyEdit;
$('editCancel').onclick=closeEdit;
$('summaryClose').onclick=()=>{$('summaryOverlay').classList.remove('open');$('summaryOverlay').setAttribute('aria-hidden','true');};

document.addEventListener('click',e=>{
  if(e.target && e.target.id==='saveDiary')saveDiaryEntry();
});

// enganche único para botones del menú flotante
Array.from(document.querySelectorAll('#editMenuOverlay [data-action]')).forEach(b=>{
  b.addEventListener('click', () => {
    if (!pendingAction) return;                  // por si acaso
    startAction(pendingAction.type, b.dataset.action);
  });
});

function login(){
  $('root').innerHTML=`<main class="login"><div class="loginbox"><h1>PRIME</h1><p>Entra y guarda tu progreso en todos tus dispositivos.</p><input id="email" class="field" type="email" placeholder="Correo electrónico"><input id="pass" class="field" type="password" placeholder="Contraseña"><button id="in" class="loginbutton">Iniciar sesión</button><button id="new" class="loginbutton">Crear cuenta</button><button id="forgot" class="link">He olvidado mi contraseña</button><div id="err" class="error"></div></div></main>`;
  const err=t=>$('err').textContent=t;
  $('in').onclick=()=>signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value).catch(e=>err(e.code));
  $('new').onclick=()=>createUserWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value).catch(e=>err(e.code));
  $('forgot').onclick=()=>sendPasswordResetEmail(auth,$('email').value.trim()).then(()=>err('Correo de recuperación enviado.')).catch(e=>err(e.code));
}

onAuthStateChanged(auth,u=>{
  user=u;if(!u){login();return;}if(stop)stop();
  stop=onSnapshot(doc(db,'users',u.uid),s=>{
    data={...defaultData,...(s.exists()?s.data():{})};
    data.profile={...defaultData.profile,...(data.profile||{})};
    data.settings={...defaultData.settings,...(data.settings||{})};
    data.settings.hidden=(data.settings.hidden||[]).filter(x=>x!=='settings');
    render();
    maybeShowDailySummary();
    compressExistingGoalImages();
  },()=>{data=defaultData;render();});
});
</script>
